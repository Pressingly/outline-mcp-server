[project]
name = "outline-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol server for Outline (wiki / knowledge base) integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Arbisoft" },
]
keywords = ["mcp", "outline", "fastmcp", "wiki", "knowledge-base"]

dependencies = [
    "fastmcp>=3.2.0,<4.0.0",
    "mcp>=1.26.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    # --- Moneta fork (AWS Cognito / mPass) ---
    # Decode the Cognito id_token to forward the right Outline identity
    # (outline_mcp/moneta/cognito.py). Present transitively via fastmcp; pinned
    # because we import it directly.
    "pyjwt>=2.0.0",
    # Register the compliance hook that corrects the upstream `expires_in`
    # (outline_mcp/moneta/cognito.py). Present transitively via fastmcp; pinned
    # because we import it directly.
    "authlib>=1.6.9",
    # Redis-backed, TLS-capable OAuth-state store for the Cognito provider
    # (outline_mcp/moneta/storage.py). Pin matches FastMCP's transitive
    # py-key-value-aio constraint.
    "py-key-value-aio[redis]>=0.4.4,<0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[project.scripts]
outline-mcp-server = "outline_mcp.__main__:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["outline_mcp*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
